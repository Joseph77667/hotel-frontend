<mat-sidenav-container class="layout">
  <mat-sidenav
    #drawer
    class="sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
  >
    <div class="brand">
      <mat-icon>hotel</mat-icon>
      <span>HotelJ</span>
    </div>

    <mat-nav-list>
      @for (item of navItems(); track item.route) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="active-link"
          (click)="isHandset() && drawer.close()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="toolbar">
      <button mat-icon-button (click)="drawer.toggle()" aria-label="Toggle menu">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="spacer"></span>

      @if (user(); as u) {
        <button mat-button class="user-button" [matMenuTriggerFor]="userMenu">
          <mat-icon>account_circle</mat-icon>
          <span class="user-name">{{ u.fullName }}</span>
          <span class="role-badge">{{ u.role }}</span>
        </button>

        <mat-menu #userMenu="matMenu" xPosition="before">
          <div class="menu-header">
            <strong>{{ u.fullName }}</strong>
            <small>{{ u.username }} · {{ u.email }}</small>
          </div>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Log out</span>
          </button>
        </mat-menu>
      }
    </mat-toolbar>

    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
